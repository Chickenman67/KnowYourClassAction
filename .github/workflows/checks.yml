# Validate every push, because nothing else does.
#
# Two gaps this closes, both silent:
#
# 1. build.yml is schedule-only. A workflow file GitHub cannot parse never
#    runs, so a typo in it would stop the daily build with no failed run to
#    notice - the schedule would simply stop firing. actionlint encodes
#    GitHub's own acceptance rules, so the typo fails here instead.
#
# 2. The test suite currently runs only inside build.yml - so the tests that
#    guard build.yml (tests/test_workflow.py) depend on build.yml being
#    runnable. That is the one thing they cannot assume. They run here too,
#    on a workflow that has nothing to do with the daily build.
#
# Deliberately a separate file: build.yml must not gain a push trigger (it
# would re-scrape the whole index on every commit), and a broken build.yml
# must not be able to take its own validation down with it.

name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: this workflow reports, it never writes to the repo.
permissions:
  contents: read

# The opposite of build.yml's setting, on purpose. Cancelling here is right:
# a superseded check has no side effects and nobody is waiting on its result.
# In build.yml it would drop a notification.
concurrency:
  group: kya-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: lint the workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Keep action majors current - see the note in build.yml.
      - uses: actions/checkout@v7

      # Pinned twice on purpose. The script comes from the release tag rather
      # than main so it cannot change under this repo, and the version is
      # passed explicitly because the script's own default lags the release it
      # shipped with (the v1.7.12 tag's copy still defaults to 1.7.11).
      - name: Install actionlint
        id: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12

      # shellcheck ships on the runner image, so the run: blocks get linted
      # too - build.yml's commit step is bash, and it pushes to main.
      - name: Lint
        run: ${{ steps.actionlint.outputs.executable }} -color

  tests:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The suite is fully offline - it runs against captured fixtures - so
      # this needs no secrets and cannot fail on a source being down.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest --tb=short

  node:
    name: node tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The Cloudflare Worker's tests: the webhook, the callback contract, and
      # the press bookkeeping. They existed well before this job did and had
      # never once run in CI - only by hand, which means the Milestone C suite
      # was unprotected against exactly the kind of edit that breaks it.
      - name: Worker webhook tests
        working-directory: worker
        run: npm test

      # The site's filter logic, the last untested behaviour in the shipped
      # product. Plain script, no dependencies, but it decides what a reader
      # actually sees.
      - name: Site filter tests
        run: node --test tests/js/site_filters.test.mjs