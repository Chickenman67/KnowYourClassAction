# Daily build: dataset + static site + Telegram digest.
#
# Pages is configured as a legacy build from main:/docs, so committing the
# rebuilt docs/ IS the deploy. The dataset and site are committed too — the
# build is deterministic, so a run shows up as a reviewable diff rather than
# a rewrite (tests/test_store.py holds that line).
#
# There is deliberately no push trigger: GITHUB_TOKEN pushes don't retrigger
# workflows, but a local push would re-scrape the whole index for nothing.
# The digest's snapshot semantics need a single build per run, so everything
# happens in one `kya --pages --site --notify-digest` invocation.
#
# Reading the Actions tab: a run named "pages-build-deployment" (event:
# `dynamic`) is GitHub deploying docs/, not a second build. Only "build" runs
# scrape, notify, and commit.
#
# tests/test_workflow.py pins the invariants this file depends on — every one
# of them fails silently, with a green build.

name: build

on:
  schedule:
    - cron: "23 6 * * *" # daily 06:23 UTC, deliberately off the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # One build at a time, and deliberately never cancel the one in progress.
  # The digest depends on that: a queued run checks out main *after* the
  # previous run committed its snapshot, so it diffs against the updated
  # baseline and stays quiet. Cancelling instead would kill a run that had
  # already sent its digest but not yet committed the snapshot, and its
  # replacement would read the old baseline and notify the same cases twice.
  # tests/test_workflow.py holds this line.
  group: kya-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Action versions are kept current because GitHub retires the Node
      # runtime an action declares: checkout@v4 declares Node 20, which is
      # already being forced onto Node 24, and the nightly build would fail
      # once that support goes. Every one of these uses no inputs beyond
      # python-version, so the v7 majors are safe for us - v7's headline change
      # is blocking fork checkouts for pull_request_target/workflow_run, which
      # this repo does not use.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The polite client's disk cache: today's run saves it, tomorrow's run
      # restores it, so a transient network failure degrades to yesterday's
      # stale copy instead of a dead run.
      - name: Restore the polite HTTP cache
        uses: actions/cache@v6
        with:
          path: .cache
          key: kya-http-${{ github.run_id }}
          restore-keys: kya-http-

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest --tb=short

      - name: Build dataset, site, and send the digest
        env:
          KYA_TELEGRAM_BOT_TOKEN: ${{ secrets.KYA_TELEGRAM_BOT_TOKEN }}
          KYA_TELEGRAM_CHAT_ID: ${{ secrets.KYA_TELEGRAM_CHAT_ID }}
          KYA_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.KYA_TELEGRAM_WEBHOOK_SECRET }}
          KYA_DECISIONS_URL: ${{ secrets.KYA_DECISIONS_URL }}
          # Optional: raises the CourtListener rate limit. Unset resolves to an
          # empty string, which the docket phase treats as anonymous access.
          KYA_COURTLISTENER_TOKEN: ${{ secrets.KYA_COURTLISTENER_TOKEN }}
        run: kya --pages --site --notify-digest

      - name: Commit the rebuilt dataset and site
        # Runs even when the build-and-digest step failed: a notification bug
        # must not also discard a dataset and site that were already written
        # (a 64-byte button payload did exactly that). The diff check below
        # still means nothing is committed when the build wrote nothing.
        if: always()
        run: |
          # Commit as the repository owner so the contributors graph stays a
          # single identity - a bot account here becomes a permanent extra
          # contributor.
          git config user.name "Chickenman67"
          git config user.email "142847431+Chickenman67@users.noreply.github.com"
          # data/ carries the digest's snapshot too, which is what lets the next
          # run tell "new" from "already reported" - see src/kya/store.py.
          git add docs data
          if git diff --cached --quiet; then
            echo "nothing changed - nothing to publish"
          else
            git commit -m "build: dataset + site (run ${{ github.run_id }})"
            git push
          fi
